<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="description" content="Registro de préstamos y deudas. Los datos quedan solo en tu teléfono." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Préstamos" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Préstamos</title>
  </head>
  <body>
    <div id="app"></div>

    <nav id="tabbar" class="tabbar" aria-label="Secciones">
      <a class="tab tappable" href="#/" data-tab="loans">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2" /><circle cx="12" cy="12" r="2.5" /></svg>
        <span>Préstamos</span>
      </a>
      <a class="tab tappable" href="#/personas" data-tab="people">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5" /><path d="M15.5 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2" /></svg>
        <span>Personas</span>
      </a>
      <a class="tab tappable" href="#/ajustes" data-tab="settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /></svg>
        <span>Ajustes</span>
      </a>
    </nav>

    <dialog id="sheet" class="sheet" aria-label="Detalle"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <noscript>Esta app necesita JavaScript para funcionar.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
